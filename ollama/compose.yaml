services:
  ollama:
    container_name: ollama
    image: ollama/ollama:0.40.16
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
      - /srv/media/ollama-models:/root/.ollama/models
    env_file:
      - ./.env
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: 8

