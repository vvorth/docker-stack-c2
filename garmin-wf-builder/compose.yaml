# docker run --rm -v ~/claude/garmin-wf-builder/vendor/fonts/:/fonts/:ro -v ~/claude/garmin-wf-builder/vendor/devices/:/devices/:ro -v $PWD:/work:rw -v wfb-keys:/keys garmin-wf-builder

services:
  garmin-wf-builder:
    container_name: garmin-wf-builder
    build:
      context: https://github.com/vvorth/garmin-wf-builder.git#${VERSION:-main}
      dockerfile: Dockerfile
    image: garmin-wf-builder:${VERSION:-main}
    pull_policy: build
    user: 1000:1000
    restart: unless-stopped
    command: ["studio", "--host=0.0.0.0", "--port=8765"]
    ports:
      - 8765:8765
    volumes:
      - ./vendor/devices:/devices:ro
      - ./vendor/fonts:/fonts:ro
      - ./data:/state:rw
      - wfb-keys:/keys:rw
    labels:
      - homepage.group=Media
      - homepage.name=Garmin WF Builder
      - homepage.description=Watchface editor
      - homepage.icon=editor
      - homepage.href=http://localhost:8765
      - homepage.statusStyle=dot
      - homepage.showStats=true

    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1G
    
volumes:
  wfb-keys:
    external: true

