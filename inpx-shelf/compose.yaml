services:
  inpx-shelf:
    container_name: inpx-shelf
    image: vvorth/inpx-shelf:${VERSION:-latest}
    # build:
    #   context: https://github.com/vvorth/inpx-shelf.git#${VERSION:-main}
    #   dockerfile: Dockerfile
    # image: inpx-shelf:${VERSION:-main}
    # pull_policy: build

    user: 1000:1000
    restart: unless-stopped
    environment:
      INPX: ${LIBDIR}/${INPX_FILE_NAME}
    env_file:
      - .env
    ports:
      - "12380:12380"
    volumes:
      - ./data:${DATA_DIR}:rw
      - ./${FB2CNG_CONFIG}:${INPX_FB2CNG_CONFIG}:ro
      - ${MEDIA_PATH}:${LIBDIR}:ro
      - ${MEDIA_PATH_2}:${LIBDIR_2}:ro
      - ${MEDIA_PATH_3}:${LIBDIR_3}:ro
    labels:
      - homepage.group=Media
      - homepage.name=Inpx-Shelf Library
      - homepage.description=E-Books Library
      - homepage.icon=calibre
      - homepage.href=http://localhost:12380
      - homepage.statusStyle=dot
      - homepage.showStats=true

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
